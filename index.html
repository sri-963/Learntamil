<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b3400f">
  <meta name="description" content="Learn to read and write Tamil script — letters, words and sentences, offline.">
  <title>தமிழ் · Learn Tamil Script</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">அ</span>
        <span class="brand-text">Learn Tamil <small>script</small></span>
      </div>
      <button id="overallProgress" class="pill" type="button" title="Letters learned">0 / 30</button>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="sheet" class="sheet-backdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div id="sheetBody"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
